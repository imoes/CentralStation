server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CSP: keine fremden oder eingeschleusten Skripte. Die Konsole zeigt Agententext als
    # HTML (bereinigt); fällt eine Bereinigung je aus, verhindert dies die Ausführung.
    #  - script-src: nur eigene Bundles + der eine Inline-Handler, mit dem Angulars
    #    Critical-CSS das Stylesheet aktiviert (onload="this.media='all'"), per Hash.
    #  - style-src 'unsafe-inline': Angular setzt Komponenten-Styles inline (keine Skripte).
    #  - frame-src https:: Grafana-Panels im Dashboard sind fremde iframes.
    #  - media-src blob:: die Sprachausgabe (TTS) spielt Audio als Blob-URL ab.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; frame-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
